<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="90mm" height="60mm" viewBox="0 0 90 60">
  <!-- Outline: cuts the coupon free from the stock. Assign the "Outline" op. -->
  <rect id="outline" x="5" y="5" width="80" height="50" rx="4" ry="4" fill="none" stroke="#000000" stroke-width="0.1"/>

  <!-- Pocket: roughing / stepover / depth-per-pass test. Assign the "Pocket" or "Area" op. -->
  <rect id="pocket" x="12" y="12" width="24" height="16" fill="none" stroke="#000000" stroke-width="0.1"/>

  <!-- Slot: narrow-feature cut, tests chip evacuation and bit deflection. Assign "Outline" or "Trace". -->
  <rect id="slot" x="45" y="16" width="32" height="6" fill="none" stroke="#000000" stroke-width="0.1"/>

  <!-- 3mm calibration hole: cut with the 3mm bit, verify actual hole diameter. Assign "Outline" or "Drill". -->
  <path id="hole-3mm" d="M 18.5,42 A 1.5,1.5 0 1,0 21.5,42 A 1.5,1.5 0 1,0 18.5,42 Z" fill="none" stroke="#000000" stroke-width="0.1"/>

  <!-- 6mm calibration hole: cut with the 6mm bit, verify actual hole diameter. Assign "Outline" or "Drill". -->
  <path id="hole-6mm" d="M 32,42 A 3,3 0 1,0 38,42 A 3,3 0 1,0 32,42 Z" fill="none" stroke="#000000" stroke-width="0.1"/>
</svg>
